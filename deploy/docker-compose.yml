services:
  mongo:
    image: mongo:8
    container_name: sansyar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sansyar_mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: sansyar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sansyar_minio_data:/data

  api:
    build:
      context: ../backend
      dockerfile: cmd/api/Dockerfile
    container_name: sansyar-api
    restart: unless-stopped
    depends_on:
      - mongo
      - minio
    environment:
      APP_ENV: development
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: sansyar
      JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      SEED_DATA: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: sansyar
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000/sansyar
    ports:
      - "8080:8080"

volumes:
  sansyar_mongo_data:
  sansyar_minio_data:
