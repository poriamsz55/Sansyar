services:
  mongo:
    image: mongo:8
    container_name: sansyar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sansyar_mongo_data:/data/db

  api:
    build:
      context: ../backend
      dockerfile: cmd/api/Dockerfile
    container_name: sansyar-api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      APP_ENV: development
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: sansyar
      JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      SEED_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  sansyar_mongo_data:
